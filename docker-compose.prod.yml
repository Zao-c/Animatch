services:
  postgres:
    image: postgres:16
    container_name: animatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - animatch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: animatch-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 223.5.5.5
      - 119.29.29.29
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NODE_ENV: production
      NODE_OPTIONS: --dns-result-order=ipv4first
      BANGUMI_PROXY_URL: ${BANGUMI_PROXY_URL:-}
      BANGUMI_ACCESS_TOKEN: ${BANGUMI_ACCESS_TOKEN:-}
    ports:
      - "3000:3000"
    volumes:
      - anime_uploads:/app/public/uploads

volumes:
  animatch_postgres_data:
  anime_uploads:

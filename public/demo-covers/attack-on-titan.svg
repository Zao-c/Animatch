<?xml version="1.0" encoding="UTF-8"?>
<!-- AniMatch official demo cover - stable local asset -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="grad-attack-on-titan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8a4a3a"/>
      <stop offset="55%"  stop-color="#4a2315"/>
      <stop offset="100%" stop-color="#2a0f05"/>
    </linearGradient>
    <radialGradient id="glow-attack-on-titan" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <pattern id="grid-attack-on-titan" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect fill="url(#grad-attack-on-titan)" width="300" height="420"/>

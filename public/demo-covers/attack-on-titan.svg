        <rect x="0" y="0" width="66" height="24" rx="12" ry="12" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.35)"/>
        <text x="33" y="16" text-anchor="middle" font-family="&quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;SimHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#ffffff">热血</text>
